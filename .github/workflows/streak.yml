name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Streak SVG
        run: |
          curl -o streak-stats.svg "https://github-readme-streak-stats.herokuapp.com/?user=ankitkr52&theme=dark&hide_border=true&background=0D1117&stroke=c82cc3&ring=c82cc3&fire=FF6B6B&currStreakLabel=ffffff&currStreakNum=ffffff&sideNums=ffffff&sideLabels=ffffff&dates=64748B"

      - name: Commit SVG
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add streak-stats.svg
          git diff --cached --quiet || git commit -m "Update streak stats"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
